[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgemind"
version = "0.2.0"
description = "ForgeMind: PyTorch training library - FSDP2/DDP/TP/PP/EP, DeepSpeed ZeRO, FP8/INT8 quantized training, smart offload, MoE"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "numpy"]

[project.optional-dependencies]
test = ["pytest"]
te = ["transformer-engine[pytorch]"]
torchao = ["torchao"]
deepspeed = ["deepspeed"]
all = ["torchao", "deepspeed"]

[tool.setuptools.packages.find]
include = ["forgemind*"]
